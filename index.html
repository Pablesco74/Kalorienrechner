<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalora - Dein smarter Kalorienrechner</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/flavicon_dark.svg">
    
    <script>
        (function() {
            var s = localStorage.getItem('kalora-theme');
            var preferLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            document.documentElement.setAttribute('data-theme', (s === 'light' || s === 'dark') ? s : (preferLight ? 'light' : 'dark'));
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo-container">
                <!-- Dark Mode Logo -->
                <img src="assets/Kalora_Dark.svg" alt="Kalora Logo" class="logo-dark">
                
                <!-- Light Mode Logo -->
                <img src="assets/Kalora_Light.svg" alt="Kalora Logo" class="logo-light">
            </div>
            <div class="theme-toggle-wrap" aria-label="Dark/Light Mode umschalten">
                <span class="theme-label theme-label-dark" aria-hidden="true">Dark</span>
                <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" title="Theme umschalten">
                    <span class="theme-toggle-track">
                        <span class="theme-toggle-thumb"></span>
                    </span>
                </button>
                <span class="theme-label theme-label-light" aria-hidden="true">Light</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="input-panel">
            <h1>Kalorien berechnen</h1>

            <div class="level-switch">
                <span class="level-switch-label">Level</span>
                <select id="neatLevel">
                    <option value="beginner">Einfach (Anfänger)</option>
                    <option value="intermediate">Standard (Fortgeschritten)</option>
                    <option value="expert">Profi (Experte)</option>
                </select>
            </div>

            <div class="input-grid">
                <div class="input-column">
                    <div class="input-section">
                        <h3>Grundumsatz</h3>
                        <div class="form-group">
                            <label for="geschlecht">Geschlecht</label>
                            <select id="geschlecht">
                                <option value="mann">Männlich</option>
                                <option value="frau">Weiblich</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="gewicht">Gewicht (kg)</label>
                            <input type="number" id="gewicht" min="20" max="300" placeholder="z.B. 75">
                        </div>
                        <div class="form-group">
                            <label for="groesse">Größe (cm)</label>
                            <input type="number" id="groesse" min="100" max="250" placeholder="z.B. 175">
                        </div>
                        <div class="form-group">
                            <label for="alter">Alter</label>
                            <input type="number" id="alter" min="10" max="120" placeholder="z.B. 30">
                        </div>
                    </div>

                    <div class="input-section">
                        <h3>NEAT / Alltagsaktivität</h3>

                        <!-- ANFÄNGER -->
                        <div class="neat-group neat-group-active" data-level="beginner">
                            <div class="form-group">
                                <label for="neatBeginner">Wie aktiv bist du im Alltag (ohne Training)?</label>
                                <select id="neatBeginner">
                                    <option value="0.08">Sehr wenig aktiv (Bürojob, viel sitzen)</option>
                                    <option value="0.12">Wenig aktiv (Büro + Hausarbeit)</option>
                                    <option value="0.18">Mäßig aktiv (viel Stehen/Gehen)</option>
                                    <option value="0.25">Sehr aktiv (körperliche Arbeit)</option>
                                </select>
                            </div>
                        </div>

                        <!-- FORTGESCHRITTEN -->
                        <div class="neat-group" data-level="intermediate">
                            <div class="form-group">
                                <label for="neatJobInter">Berufliche Aktivität</label>
                                <select id="neatJobInter">
                                    <option value="0.05">Sitzend (Büro, Homeoffice)</option>
                                    <option value="0.08">Teilweise stehend/gehend</option>
                                    <option value="0.12">Überwiegend stehend/gehend</option>
                                    <option value="0.18">Körperlich anstrengend</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="neatLeisure">Freizeit-Aktivität</label>
                                <select id="neatLeisure">
                                    <option value="0.03">Wenig Bewegung (TV, Lesen)</option>
                                    <option value="0.06">Leichte Aktivität (Kochen, Aufräumen)</option>
                                    <option value="0.10">Moderate Aktivität (Gartenarbeit, Kinder)</option>
                                </select>
                            </div>
                        </div>

                        <!-- EXPERTE -->
                        <div class="neat-group" data-level="expert">
                            <h4 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; font-weight: 600;">Berufliche Aktivität</h4>
                            <div class="form-group">
                                <label for="neatJobExpert">Art der Arbeit</label>
                                <select id="neatJobExpert">
                                    <option value="0.05">Sitzend (Büro, Student)</option>
                                    <option value="0.10">Leicht aktiv (stehend/gehend)</option>
                                    <option value="0.15">Moderat aktiv (Handwerk)</option>
                                    <option value="0.20">Sehr aktiv (Bauarbeiter)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="neatWorkDays">Arbeitstage pro Woche</label>
                                <input type="number" id="neatWorkDays" min="0" max="7" value="5">
                            </div>

                            <h4 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; margin-top: 1.5rem; font-weight: 600;">Alltags-Aktivität (außerhalb Job & Training)</h4>
                            <div class="form-group">
                                <label for="neatDaily">Aktivitätslevel</label>
                                <select id="neatDaily">
                                    <option value="0.03">Minimal (wenig Bewegung)</option>
                                    <option value="0.06">Niedrig (normale Hausarbeit)</option>
                                    <option value="0.09">Moderat (aktiv im Alltag)</option>
                                    <option value="0.12">Hoch (sehr aktiver Lifestyle)</option>
                                </select>
                            </div>

                            <h4 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; margin-top: 1.5rem; font-weight: 600;">Trainingsfreie Tage</h4>
                            <div class="form-group">
                                <label for="neatRestDays">Rest Days pro Woche</label>
                                <input type="number" id="neatRestDays" min="0" max="7" value="2">
                            </div>
                            <div class="form-group">
                                <label for="neatRestActivity">Aktivität an Rest Days</label>
                                <select id="neatRestActivity">
                                    <option value="0.00">Volle Erholung (komplett passiv)</option>
                                    <option value="0.05">Light Activity (Spazieren, Mobility)</option>
                                    <option value="0.08">Active Recovery (lange Walks, Rad)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="input-section">
                        <h3>Tägliche Aktivität</h3>
                        <div class="form-group">
                            <label for="schritte">Schritte pro Tag</label>
                            <input type="number" id="schritte" min="0" max="40000" step="500" value="8000">
                        </div>
                    </div>
                </div>

                <div class="input-column">
                    <div class="input-section">
                        <h3>Krafttraining</h3>
                        <div class="form-group">
                            <label for="sportIntensitaet">Intensität</label>
                            <select id="sportIntensitaet">
                                <option value="4.5">Moderat</option>
                                <option value="6.5">Intensiv</option>
                                <option value="8">Sehr intensiv</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sportFreq">Einheiten pro Woche</label>
                            <select id="sportFreq">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sportDauer">Dauer pro Einheit (Minuten)</label>
                            <input type="number" id="sportDauer" min="10" max="180" value="60">
                        </div>
                    </div>

                    <div class="input-section">
                        <h3>Cardio</h3>
                        <div class="form-group">
                            <label for="cardioIntensitaet">Intensität</label>
                            <select id="cardioIntensitaet">
                                <option value="6">Locker (120–130 BPM)</option>
                                <option value="8">Mittel (130–150 BPM)</option>
                                <option value="10">Hart (150–170 BPM)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cardioFreq">Einheiten pro Woche</label>
                            <select id="cardioFreq">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cardioDauer">Dauer pro Einheit (Minuten)</label>
                            <input type="number" id="cardioDauer" min="10" max="120" value="30">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="canvas-panel">
            <div class="canvas-container">
                <canvas id="kcalChart"></canvas>
                <div class="canvas-center">
                    <div class="canvas-center-value" id="totalCalories">-</div>
                    <div class="canvas-center-label">kcal / Tag</div>
                </div>
            </div>
            <div id="statusMessage"></div>
        </section>
    </main>

    <script src="script.js"></script>

    <footer class="site-footer">
        <p>&copy; 2026 Kalora - Dein smarter Kalorien Guide</p>
        <a href="legal.html" class="footer-link">Impressum & Datenschutz</a>
    </footer>

</body>
</html>
