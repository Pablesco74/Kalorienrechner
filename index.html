<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kalorienrechner</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      background: #f9fafb;
      color: #111827;
    }

    body.dark {
      background: #0f172a;
      color: #e5e7eb;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    body.dark input,
    body.dark select {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #334155;
    }

    button {
      padding: 12px;
      width: 100%;
      font-size: 16px;
      margin-top: 20px;
    }

    canvas {
      max-width: 100%;
      height: 320px !important;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<h1>Kalorienrechner</h1>

<!-- BASISDATEN -->
<label for="geschlecht">Geschlecht</label>
<select id="geschlecht">
  <option value="mann">Männlich</option>
  <option value="frau">Weiblich</option>
</select>

<label for="gewicht">Gewicht (kg)</label>
<input type="number" id="gewicht">

<label for="groesse">Größe (cm)</label>
<input type="number" id="groesse">

<label for="alter">Alter</label>
<input type="number" id="alter">

<hr>

<!-- SCHRITTE -->
<label for="schritte">Schritte pro Tag</label>
<input type="range" id="schritte" min="3000" max="20000" step="500" value="8000">
<p>Schritte: <span id="schritteAnzeige">8000</span></p>

<hr>

<!-- SPORT -->
<h3>Krafttraining</h3>

<label for="sportIntensitaet">Intensität</label>
<select id="sportIntensitaet">
  <option value="5">Moderat</option>
  <option value="7">Intensiv</option>
  <option value="9">Sehr intensiv</option>
</select>

<label for="sportFreq">Einheiten pro Woche</label>
<select id="sportFreq">
  <option value="0">0</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
</select>

<label for="sportDauer">Dauer pro Einheit (Minuten)</label>
<input type="range" id="sportDauer" min="20" max="120" step="10" value="60">
<p>Dauer: <span id="sportAnzeige">60</span> Minuten</p>

<hr>

<!-- CARDIO -->
<h3>Cardio</h3>

<label for="cardioIntensitaet">Intensität</label>
<select id="cardioIntensitaet">
  <option value="6">Locker (120–130 BPM)</option>
  <option value="8">Mittel (130–150 BPM)</option>
  <option value="10">Hart (150–170 BPM)</option>
</select>

<label for="cardioFreq">Einheiten pro Woche</label>
<select id="cardioFreq">
  <option value="0">0</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
</select>

<label for="cardioDauer">Dauer pro Einheit (Minuten)</label>
<input type="range" id="cardioDauer" min="10" max="90" step="5" value="30">
<p>Dauer: <span id="cardioAnzeige">30</span> Minuten</p>

<button onclick="berechnen()">Kalorien berechnen</button>

<canvas id="kcalChart"></canvas>
<p id="ergebnis"></p>

<script>
/* 🌙 Dark Mode automatisch */
if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
  document.body.classList.add("dark");
}

let kcalChart = null;

/* ELEMENTE */
const el = {
  geschlecht, gewicht, groesse, alter,
  schritte, schritteAnzeige,
  sportIntensitaet, sportFreq, sportDauer, sportAnzeige,
  cardioIntensitaet, cardioFreq, cardioDauer, cardioAnzeige,
  ergebnis
};

/* Slider Anzeigen */
schritte.oninput = () => schritteAnzeige.innerText = schritte.value;
sportDauer.oninput = () => sportAnzeige.innerText = sportDauer.value;
cardioDauer.oninput = () => cardioAnzeige.innerText = cardioDauer.value;

/* Berechnungen */
const berechneBMR = (g, gr, a, sex) =>
  sex === "mann"
    ? 10 * g + 6.25 * gr - 5 * a + 5
    : 10 * g + 6.25 * gr - 5 * a - 161;

const berechneSchritteKcal = (s, g, gr) =>
  s * g * 0.0005 * (gr / 170);

const berechneAktivitaetKcal = (met, dauer, freq, g) =>
  ((met * g * (dauer / 60)) * freq) / 7;

/* Diagramm */
function zeichneDiagramm(bmr, schritte, sport, cardio) {
  const ctx = document.getElementById("kcalChart");
  if (kcalChart) kcalChart.destroy();

  kcalChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: ["Grundumsatz", "Schritte", "Sport", "Cardio"],
      datasets: [{
        data: [bmr, schritte, sport, cardio],
        backgroundColor: ["#64748b", "#22c55e", "#f97316", "#ef4444"]
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            color: document.body.classList.contains("dark") ? "#e5e7eb" : "#111827"
          }
        }
      }
    }
  });
}

/* Hauptfunktion */
function berechnen() {
  if (!gewicht.value || !groesse.value || !alter.value) return;

  const bmr = berechneBMR(+gewicht.value, +groesse.value, +alter.value, geschlecht.value);
  const schritteKcal = berechneSchritteKcal(+schritte.value, +gewicht.value, +groesse.value);
  const sportKcal = berechneAktivitaetKcal(+sportIntensitaet.value, +sportDauer.value, +sportFreq.value, +gewicht.value);
  const cardioKcal = berechneAktivitaetKcal(+cardioIntensitaet.value, +cardioDauer.value, +cardioFreq.value, +gewicht.value);

  const gesamt = bmr + schritteKcal + sportKcal + cardioKcal;

  ergebnis.innerHTML = `<strong>Gesamtbedarf:</strong> ${Math.round(gesamt)} kcal / Tag`;
  zeichneDiagramm(bmr, schritteKcal, sportKcal, cardioKcal);
}

/* Live Update */
document.querySelectorAll("input, select").forEach(el =>
  el.addEventListener("input", berechnen)
);
</script>

</body>
</html>
