<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalora - Dein smarter Kalorienrechner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <svg width="480" height="120" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg">
                <!-- Background -->
                <rect width="480" height="120" fill="transparent"/>
                
                <!-- Progress Bars (Bottom aligned) -->
                <!-- Left Bar -->
                <rect x="20" y="60" width="15" height="40" fill="#3B82F6" rx="3"/>
                <!-- Middle Bar -->
                <rect x="45" y="40" width="15" height="60" fill="#22C55E" rx="3"/>
                <!-- Right Bar -->
                <rect x="70" y="20" width="15" height="80" fill="#F97316" rx="3"/>
                
                <!-- Brand Text -->
                <text x="110" y="68" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="44" fill="#FFFFFF">Kalora</text>
                
                <!-- Slogan -->
                <text x="112" y="94" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="14" fill="#94A3B8">Dein smarter Kalorienrechner</text>
            </svg>
        </div>
    </header>

    <main class="container">
        <section class="input-panel">
            <h1>Kalorien berechnen</h1>

            <div class="input-grid">
                <div class="input-column">
                    <div class="input-section">
                        <h3>Grundumsatz</h3>
                        <div class="form-group">
                            <label for="geschlecht">Geschlecht</label>
                            <select id="geschlecht">
                                <option value="mann">Männlich</option>
                                <option value="frau">Weiblich</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="gewicht">Gewicht (kg)</label>
                            <input type="number" id="gewicht" min="20" max="300" placeholder="z.B. 75">
                        </div>
                        <div class="form-group">
                            <label for="groesse">Größe (cm)</label>
                            <input type="number" id="groesse" min="100" max="250" placeholder="z.B. 175">
                        </div>
                        <div class="form-group">
                            <label for="alter">Alter</label>
                            <input type="number" id="alter" min="10" max="120" placeholder="z.B. 30">
                        </div>
                    </div>

                    <div class="input-section">
                        <h3>Tägliche Aktivität</h3>
                        <div class="form-group">
                            <label for="schritte">Schritte pro Tag</label>
                            <input type="number" id="schritte" min="0" max="40000" step="500" value="8000">
                        </div>
                    </div>
                </div>

                <div class="input-column">
                    <div class="input-section">
                        <h3>Krafttraining</h3>
                        <div class="form-group">
                            <label for="sportIntensitaet">Intensität</label>
                            <select id="sportIntensitaet">
                                <option value="4.5">Moderat</option>
                                <option value="6.5">Intensiv</option>
                                <option value="8">Sehr intensiv</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sportFreq">Einheiten pro Woche</label>
                            <select id="sportFreq">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sportDauer">Dauer pro Einheit (Minuten)</label>
                            <input type="number" id="sportDauer" min="10" max="180" value="60">
                        </div>
                    </div>

                    <div class="input-section">
                        <h3>Cardio</h3>
                        <div class="form-group">
                            <label for="cardioIntensitaet">Intensität</label>
                            <select id="cardioIntensitaet">
                                <option value="6">Locker (120–130 BPM)</option>
                                <option value="8">Mittel (130–150 BPM)</option>
                                <option value="10">Hart (150–170 BPM)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cardioFreq">Einheiten pro Woche</label>
                            <select id="cardioFreq">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cardioDauer">Dauer pro Einheit (Minuten)</label>
                            <input type="number" id="cardioDauer" min="10" max="120" value="30">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="canvas-panel">
            <div class="canvas-container">
                <canvas id="kcalChart"></canvas>
                <div class="canvas-center">
                    <div class="canvas-center-value" id="totalCalories">-</div>
                    <div class="canvas-center-label">kcal / Tag</div>
                </div>
            </div>
            <div id="statusMessage"></div>
        </section>
    </main>

    <script src="script.js"></script>
    
    <!-- ... Dein restlicher Inhalt der Webseite ... -->

    <footer style="margin-top: 50px; padding: 20px; text-align: center; border-top: 1px solid #eee; font-family: 'Inter', sans-serif;">
        <p style="color: #95A5A6; font-size: 12px;">&copy; 2026 Kalora - Dein smarter Kalorien Guide</p>
        <a href="legal.html" style="color: #1A237E; text-decoration: none; font-size: 14px; font-weight: 600;">Impressum & Datenschutz</a>
    </footer>

</body>
</html>
