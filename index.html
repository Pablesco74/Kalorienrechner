<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalora - Dein smarter Kalorienrechner</title>
    <script>
        (function() {
            var s = localStorage.getItem('kalora-theme');
            var preferLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            document.documentElement.setAttribute('data-theme', (s === 'light' || s === 'dark') ? s : (preferLight ? 'light' : 'dark'));
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-inner">
        <div class="logo-container">
            <img
                class="logo"
                src="assets/kalora-logo.png"
                alt="Kalora"
                decoding="async"
                fetchpriority="high"
            >
        </div>
        <div class="theme-toggle-wrap" aria-label="Dark/Light Mode umschalten">
            <span class="theme-label theme-label-dark" aria-hidden="true">Dark</span>
            <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" title="Theme umschalten">
                <span class="theme-toggle-track">
                    <span class="theme-toggle-thumb"></span>
                </span>
            </button>
            <span class="theme-label theme-label-light" aria-hidden="true">Light</span>
        </div>
        </div>
    </header>

    <main class="container">
        <section class="input-panel">
            <h1>Kalorien berechnen</h1>

            <div class="level-switch">
                <span class="level-switch-label">Level</span>
                <select id="neatLevel">
                    <option value="beginner">Einfach (Anfänger)</option>
                    <option value="intermediate">Standard (Fortgeschritten)</option>
                    <option value="expert">Profi (Experte)</option>
                </select>
            </div>

            <div class="input-grid">
                <div class="input-column">
                    <div class="input-section">
                        <h3>Grundumsatz</h3>
                        <div class="form-group">
                            <label for="geschlecht">Geschlecht</label>
                            <select id="geschlecht">
                                <option value="mann">Männlich</option>
                                <option value="frau">Weiblich</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="gewicht">Gewicht (kg)</label>
                            <input type="number" id="gewicht" min="20" max="300" placeholder="z.B. 75">
                        </div>
                        <div class="form-group">
                            <label for="groesse">Größe (cm)</label>
                            <input type="number" id="groesse" min="100" max="250" placeholder="z.B. 175">
                        </div>
                        <div class="form-group">
                            <label for="alter">Alter</label>
                            <input type="number" id="alter" min="10" max="120" placeholder="z.B. 30">
                        </div>
                    </div>

                    <div class="input-section">
                        <h3>NEAT / Alltagsaktivität</h3>

                        <div class="neat-group neat-group-active" data-level="beginner">
                            <div class="form-group">
                                <label for="neatBeginner">Wie aktiv bist du im Alltag (ohne Sport)?</label>
                                <select id="neatBeginner">
                                    <option value="0.15">Viel Sitzen (Büro, Homeoffice)</option>
                                    <option value="0.25">Überwiegend sitzend, kurze Wege</option>
                                    <option value="0.35">Viel Stehen/Gehen im Alltag</option>
                                    <option value="0.45">Körperlich anstrengender Job</option>
                                </select>
                            </div>
                        </div>

                        <div class="neat-group" data-level="intermediate">
                            <div class="form-group">
                                <label for="neatJob">Job-Alltag</label>
                                <select id="neatJob">
                                    <option value="0.10">Büro / überwiegend sitzend</option>
                                    <option value="0.20">Mischform sitzend &amp; gehend</option>
                                    <option value="0.30">Überwiegend gehend/stehend</option>
                                    <option value="0.40">Körperlich anstrengend</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="neatLeisure">Freizeit-Alltag</label>
                                <select id="neatLeisure">
                                    <option value="0.05">Viel Sitzen</option>
                                    <option value="0.10">Gemischt</option>
                                    <option value="0.15">Viel Bewegung</option>
                                </select>
                            </div>
                        </div>

                        <div class="neat-group" data-level="expert">
                            <div class="form-group">
                                <label for="neatMinutes">Minuten bewusste Bewegung / Tag (ohne Sport)</label>
                                <input type="number" id="neatMinutes" min="0" max="300" value="60">
                            </div>
                            <div class="form-group">
                                <label for="neatDays">Tage pro Woche mit dieser Aktivität</label>
                                <input type="number" id="neatDays" min="1" max="7" value="7">
                            </div>
                        </div>
                    </div>

                    <div class="input-section">
                        <h3>Tägliche Aktivität</h3>
                        <div class="form-group">
                            <label for="schritte">Schritte pro Tag</label>
                            <input type="number" id="schritte" min="0" max="40000" step="500" value="8000">
                        </div>
                    </div>
                </div>

                <div class="input-column">
                    <div class="input-section">
                        <h3>Krafttraining</h3>
                        <div class="form-group">
                            <label for="sportIntensitaet">Intensität</label>
                            <select id="sportIntensitaet">
                                <option value="4.5">Moderat</option>
                                <option value="6.5">Intensiv</option>
                                <option value="8">Sehr intensiv</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sportFreq">Einheiten pro Woche</label>
                            <select id="sportFreq">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sportDauer">Dauer pro Einheit (Minuten)</label>
                            <input type="number" id="sportDauer" min="10" max="180" value="60">
                        </div>
                    </div>

                    <div class="input-section">
                        <h3>Cardio</h3>
                        <div class="form-group">
                            <label for="cardioIntensitaet">Intensität</label>
                            <select id="cardioIntensitaet">
                                <option value="6">Locker (120–130 BPM)</option>
                                <option value="8">Mittel (130–150 BPM)</option>
                                <option value="10">Hart (150–170 BPM)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cardioFreq">Einheiten pro Woche</label>
                            <select id="cardioFreq">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cardioDauer">Dauer pro Einheit (Minuten)</label>
                            <input type="number" id="cardioDauer" min="10" max="120" value="30">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="canvas-panel">
            <div class="canvas-container">
                <canvas id="kcalChart"></canvas>
                <div class="canvas-center">
                    <div class="canvas-center-value" id="totalCalories">-</div>
                    <div class="canvas-center-label">kcal / Tag</div>
                </div>
            </div>
            <div id="statusMessage"></div>
        </section>
    </main>

    <script src="script.js"></script>
    
    <!-- ... Dein restlicher Inhalt der Webseite ... -->

    <footer class="site-footer">
        <p>&copy; 2026 Kalora - Dein smarter Kalorien Guide</p>
        <a href="legal.html" class="footer-link">Impressum & Datenschutz</a>
    </footer>

</body>
</html>
