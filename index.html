<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalora - Dein smarter Kalorienrechner</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/flavicon_dark.svg">
    
    <script>
        // Setze Theme basierend auf System-Präferenz
        (function() {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo-container">
                <!-- Dark Mode Logo -->
                <img src="assets/Kalora_Dark.svg" alt="Kalora Logo" class="logo-dark">
                
                <!-- Light Mode Logo -->
                <img src="assets/Kalora_Light.svg" alt="Kalora Logo" class="logo-light">
            </div>
        </div>
    </header>

    <main class="container">
        <section class="input-panel">
            <h1>Kalorien berechnen</h1>

            <div class="input-grid">
                <div class="input-column">
                    <div class="input-section">
                        <h3>Grundumsatz</h3>
                        <div class="form-group">
                            <label for="geschlecht">Geschlecht</label>
                            <select id="geschlecht">
                                <option value="mann">Männlich</option>
                                <option value="frau">Weiblich</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="gewicht">Gewicht (kg)</label>
                            <input type="number" id="gewicht" min="20" max="300" placeholder="z.B. 75">
                        </div>
                        <div class="form-group">
                            <label for="groesse">Größe (cm)</label>
                            <input type="number" id="groesse" min="100" max="250" placeholder="z.B. 175">
                        </div>
                        <div class="form-group">
                            <label for="alter">Alter</label>
                            <input type="number" id="alter" min="10" max="120" placeholder="z.B. 30">
                        </div>
                        <div class="kfa-group">
                            <div class="form-group">
                                <label for="kfa">Körperfettanteil (KFA)</label>
                                <input type="number" id="kfa" min="5" max="60" step="0.1" placeholder="optional, in %" title="Optional – wird nur unter 11 % oder über 25 % für die Grundumsatz-Berechnung genutzt.">
                                <p class="field-hint">Optional – wird nur unter 11&nbsp;% oder über 25&nbsp;% für den Grundumsatz verwendet.</p>
                            </div>
                        </div>
                    </div>

                    <!-- ARBEIT & ALLTAG Section -->
                    <div class="input-section">
                        <h3>Arbeit &amp; Alltag</h3>

                        <div class="form-group">
                            <label for="workDays">Arbeitstage pro Woche</label>
                            <input type="number" id="workDays" min="0" max="7" value="5">
                        </div>

                        <div class="form-group">
                            <label for="neatWork">Aktivität an Arbeitstagen</label>
                            <select id="neatWork">
                                <option value="0.08">Sitzend (Büro, Homeoffice)</option>
                                <option value="0.12">Aktiv (viel Stehen/Gehen)</option>
                                <option value="0.18">Sehr aktiv (körperliche Arbeit)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="neatRest">Aktivität an freien Tagen</label>
                            <select id="neatRest">
                                <option value="0.05">Entspannt (viel Ruhe)</option>
                                <option value="0.08">Normal (Hausarbeit, Hobbys)</option>
                                <option value="0.12">Aktiv (Sport, Ausflüge)</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-section">
                        <h3>Tägliche Aktivität</h3>
                        <div class="form-group">
                            <label for="schritte">Schritte pro Tag</label>
                            <input type="number" id="schritte" min="0" max="40000" step="500" value="8000">
                        </div>
                    </div>
                </div>

                <div class="input-column">
                    <!-- TRAINING Section -->
                    <div class="input-section">
                        <h3>Training</h3>

                        <h4 class="training-subheading">Krafttraining</h4>

                        <div class="form-group">
                            <label for="kraftFreq">Einheiten pro Woche</label>
                            <select id="kraftFreq">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="kraftMet">Intensität</label>
                            <select id="kraftMet">
                                <option value="4.5">Moderat</option>
                                <option value="6.5">Intensiv</option>
                                <option value="8">Sehr intensiv</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="kraftDur">Dauer pro Einheit (Minuten)</label>
                            <input type="number" id="kraftDur" min="10" max="180" value="60">
                        </div>

                        <h4 class="training-subheading training-subheading--spaced">Cardio</h4>

                        <div class="form-group">
                            <label for="cardioFreq">Einheiten pro Woche</label>
                            <select id="cardioFreq">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="cardioMet">Intensität</label>
                            <select id="cardioMet">
                                <option value="6">Locker (120–130 BPM)</option>
                                <option value="8">Mittel (130–150 BPM)</option>
                                <option value="10">Hart (150–170 BPM)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="cardioDur">Dauer pro Einheit (Minuten)</label>
                            <input type="number" id="cardioDur" min="10" max="120" value="30">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="canvas-panel">
            <div class="canvas-container">
                <canvas id="kcalChart"></canvas>
                <div class="canvas-center">
                    <div class="canvas-center-value" id="totalCalories">-</div>
                    <div class="canvas-center-label">kcal / Tag</div>
                </div>
            </div>
            <div id="statusMessage"></div>
        </section>
    </main>

    <script src="script.js"></script>

    <footer class="site-footer">
        <p>&copy; 2026 Kalora - Dein smarter Kalorien Guide</p>
        <a href="legal.html" class="footer-link">Impressum &amp; Datenschutz</a>
    </footer>

</body>
</html>
