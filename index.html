<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kalorienrechner</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
    }
    label {
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
    }
    button {
      padding: 12px;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>Kalorienrechner</h1>

<!-- BASISDATEN -->
<label>Geschlecht</label>
<select id="geschlecht">
  <option value="mann">Männlich</option>
  <option value="frau">Weiblich</option>
</select>

<label>Gewicht (kg)</label>
<input type="number" id="gewicht">

<label>Größe (cm)</label>
<input type="number" id="groesse">

<label>Alter</label>
<input type="number" id="alter">

<hr>

<!-- SCHRITTE -->
<label>Schritte pro Tag</label>
<input type="range" id="schritte" min="3000" max="20000" step="500" value="8000">
<p>Schritte: <span id="schritteAnzeige">8000</span></p>

<hr>

<!-- SPORT -->
<h3>Krafttraining</h3>

<label>Intensität</label>
<select id="sportIntensitaet">
  <option value="5">Moderat</option>
  <option value="7">Intensiv</option>
  <option value="9">Sehr intensiv</option>
</select>

<label>Einheiten pro Woche</label>
<select id="sportFreq">
  <option value="0">0</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
</select>

<label>Dauer pro Einheit (Minuten)</label>
<input type="range" id="sportDauer" min="20" max="120" step="10" value="60">
<p>Dauer: <span id="sportAnzeige">60</span> Minuten</p>

<hr>

<!-- CARDIO -->
<h3>Cardio</h3>

<label>Intensität</label>
<select id="cardioIntensitaet">
  <option value="6">Locker (120–130 BPM)</option>
  <option value="8">Mittel (130–150 BPM)</option>
  <option value="10">Hart (150–170 BPM)</option>
</select>

<label>Einheiten pro Woche</label>
<select id="cardioFreq">
  <option value="0">0</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
</select>

<label>Dauer pro Einheit (Minuten)</label>
<input type="range" id="cardioDauer" min="10" max="90" step="5" value="30">
<p>Dauer: <span id="cardioAnzeige">30</span> Minuten</p>

<hr>

<button onclick="berechnen()">Kalorien berechnen</button>

<canvas id="kcalChart" width="400" height="400"></canvas>

<p id="ergebnis"></p>

<script>
/* Chart-Variable */
  let kcalChart = null;
/* ELEMENTE HOLEN */
const el = {
  geschlecht: document.getElementById("geschlecht"),
  gewicht: document.getElementById("gewicht"),
  groesse: document.getElementById("groesse"),
  alter: document.getElementById("alter"),
  schritte: document.getElementById("schritte"),
  schritteAnzeige: document.getElementById("schritteAnzeige"),
  sportIntensitaet: document.getElementById("sportIntensitaet"),
  sportFreq: document.getElementById("sportFreq"),
  sportDauer: document.getElementById("sportDauer"),
  sportAnzeige: document.getElementById("sportAnzeige"),
  cardioIntensitaet: document.getElementById("cardioIntensitaet"),
  cardioFreq: document.getElementById("cardioFreq"),
  cardioDauer: document.getElementById("cardioDauer"),
  cardioAnzeige: document.getElementById("cardioAnzeige"),
  ergebnis: document.getElementById("ergebnis")
};

/* REGLER-ANZEIGEN */
el.schritte.oninput = () => el.schritteAnzeige.innerText = el.schritte.value;
el.sportDauer.oninput = () => el.sportAnzeige.innerText = el.sportDauer.value;
el.cardioDauer.oninput = () => el.cardioAnzeige.innerText = el.cardioDauer.value;

/* BERECHNUNGEN */
function berechneBMR(g, gr, a, sex) {
  return sex === "mann"
    ? 10 * g + 6.25 * gr - 5 * a + 5
    : 10 * g + 6.25 * gr - 5 * a - 161;
}

  /* SCHRITTE MIT GEWICHT & GRÖSSE */
function berechneSchritteKcal(s, g, gr) {
  return s * g * 0.0005 * (gr / 170);
}

function berechneAktivitaetKcal(met, dauer, freq, gewicht) {
  let kcalProEinheit = met * gewicht * (dauer / 60);
  return (kcalProEinheit * freq) / 7;
}

/* HAUPTFUNKTION */
function berechnen() {
  let g = +el.gewicht.value;
  let gr = +el.groesse.value;
  let a = +el.alter.value;
  let sex = el.geschlecht.value;

  /* einfache Validierung */
  if (!g || !gr || !a) {
    el.ergebnis.innerHTML = "Bitte alle Basisdaten eingeben.";
    return;
  }

  let bmr = berechneBMR(g, gr, a, sex);
  let schritteKcal = berechneSchritteKcal(+el.schritte.value, g, gr);

  let sportKcal = berechneAktivitaetKcal(
    +el.sportIntensitaet.value,
    +el.sportDauer.value,
    +el.sportFreq.value,
    g
  );

  let cardioKcal = berechneAktivitaetKcal(
    +el.cardioIntensitaet.value,
    +el.cardioDauer.value,
    +el.cardioFreq.value,
    g
  );

  let gesamt = bmr + schritteKcal + sportKcal + cardioKcal;

  /* PROZENTE */
  let pBMR = (bmr / gesamt) * 100;
  let pSchritte = (schritteKcal / gesamt) * 100;
  let pSport = (sportKcal / gesamt) * 100;
  let pCardio = (cardioKcal / gesamt) * 100;

  /* MIN / MAX */
  let minGesamt =
    bmr * 0.95 +
    schritteKcal * 0.9 +
    sportKcal * 0.85 +
    cardioKcal * 0.85;

  let maxGesamt =
    bmr * 1.05 +
    schritteKcal * 1.1 +
    sportKcal * 1.15 +
    cardioKcal * 1.15;

  function zeichneDiagramm(bmr, schritte, sport, cardio) {
  const ctx = document.getElementById("kcalChart").getContext("2d");

  if (kcalChart) {
    kcalChart.destroy(); // wichtig für Updates
  }

  kcalChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: ["Grundumsatz", "Schritte", "Sport", "Cardio"],
      datasets: [{
        data: [bmr, schritte, sport, cardio],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: "bottom"
        }
      }
    }
  });
}

  el.ergebnis.innerHTML = `
    <strong>Gesamtbedarf:</strong> ${Math.round(gesamt)} kcal / Tag<br>
    <strong>Realistische Spanne:</strong> ${Math.round(minGesamt)} – ${Math.round(maxGesamt)} kcal<br><br>

    <strong>Aufschlüsselung:</strong><br>
    Grundumsatz: ${Math.round(bmr)} kcal (${pBMR.toFixed(1)} %)<br>
    Schritte: ${Math.round(schritteKcal)} kcal (${pSchritte.toFixed(1)} %)<br>
    Sport: ${Math.round(sportKcal)} kcal (${pSport.toFixed(1)} %)<br>
    Cardio: ${Math.round(cardioKcal)} kcal (${pCardio.toFixed(1)} %)
  `;
}
  
zeichneDiagramm(
  Math.round(bmr),
  Math.round(schritteKcal),
  Math.round(sportKcal),
  Math.round(cardioKcal)
);
  
</script>


</body>
</html>
