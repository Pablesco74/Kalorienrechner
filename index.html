<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kalorienrechner</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      background: #f9fafb;
      color: #111827;
      padding: 0 20px;
    }

    body.dark {
      background: #0f172a;
      color: #e5e7eb;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    body.dark input,
    body.dark select {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #334155;
    }

    button {
      padding: 12px;
      width: 100%;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
    }

    button:hover {
      background: #2563eb;
    }

    canvas {
      max-width: 100%;
      margin-top: 30px;
    }

    .fehler {
      color: #ef4444;
      font-weight: bold;
      margin-top: 10px;
    }

    .erfolg {
      color: #22c55e;
      font-weight: bold;
      margin-top: 10px;
    }

    body.dark .fehler {
      color: #fca5a5;
    }

    body.dark .erfolg {
      color: #86efac;
    }
  </style>
</head>

<body>

<h1>Kalorienrechner</h1>

<!-- BASISDATEN -->
<label for="geschlecht">Geschlecht</label>
<select id="geschlecht">
  <option value="mann">Männlich</option>
  <option value="frau">Weiblich</option>
</select>

<label for="gewicht">Gewicht (kg)</label>
<input type="number" id="gewicht" min="20" max="300" placeholder="z.B. 75">

<label for="groesse">Größe (cm)</label>
<input type="number" id="groesse" min="100" max="250" placeholder="z.B. 175">

<label for="alter">Alter</label>
<input type="number" id="alter" min="10" max="120" placeholder="z.B. 30">

<hr>

<!-- SCHRITTE -->
<label for="schritte">Schritte pro Tag</label>
<input type="range" id="schritte" min="3000" max="20000" step="500" value="8000">
<p>Schritte: <span id="schritteAnzeige">8000</span></p>

<hr>

<!-- SPORT -->
<h3>Krafttraining</h3>

<label for="sportIntensitaet">Intensität</label>
<select id="sportIntensitaet">
  <option value="4,5">Moderat</option>
  <option value="6,5">Intensiv</option>
  <option value="8">Sehr intensiv</option>
</select>

<label for="sportFreq">Einheiten pro Woche</label>
<select id="sportFreq">
  <option value="0">0</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
</select>

<label for="sportDauer">Dauer pro Einheit (Minuten)</label>
<input type="range" id="sportDauer" min="20" max="120" step="10" value="60">
<p>Dauer: <span id="sportAnzeige">60</span> Minuten</p>

<hr>

<!-- CARDIO -->
<h3>Cardio</h3>

<label for="cardioIntensitaet">Intensität</label>
<select id="cardioIntensitaet">
  <option value="6">Locker (120–130 BPM)</option>
  <option value="8">Mittel (130–150 BPM)</option>
  <option value="10">Hart (150–170 BPM)</option>
</select>

<label for="cardioFreq">Einheiten pro Woche</label>
<select id="cardioFreq">
  <option value="0">0</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
</select>

<label for="cardioDauer">Dauer pro Einheit (Minuten)</label>
<input type="range" id="cardioDauer" min="10" max="90" step="5" value="30">
<p>Dauer: <span id="cardioAnzeige">30</span> Minuten</p>

<button onclick="berechnen()">Kalorien berechnen</button>

<canvas id="kcalChart"></canvas>
<p id="ergebnis"></p>

<script>
/* 🌙 Dark Mode automatisch */
if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
  document.body.classList.add("dark");
}

let kcalChart = null;

/* ELEMENTE */
const el = {
  geschlecht, gewicht, groesse, alter,
  schritte, schritteAnzeige,
  sportIntensitaet, sportFreq, sportDauer, sportAnzeige,
  cardioIntensitaet, cardioFreq, cardioDauer, cardioAnzeige,
  ergebnis
};

/* Slider Anzeigen */
schritte.oninput = () => schritteAnzeige.innerText = schritte.value;
sportDauer.oninput = () => sportAnzeige.innerText = sportDauer.value;
cardioDauer.oninput = () => cardioAnzeige.innerText = cardioDauer.value;

/* VALIDATION - Überprüft, ob Eingaben korrekt sind */
function validiereEingaben(g, gr, a) {
  if (!g || !gr || !a) {
    return "Bitte alle Felder ausfüllen!";
  }
  if (g < 20 || g > 300) {
    return "Gewicht muss zwischen 20 und 300 kg sein!";
  }
  if (gr < 100 || gr > 250) {
    return "Größe muss zwischen 100 und 250 cm sein!";
  }
  if (a < 10 || a > 120) {
    return "Alter muss zwischen 10 und 120 Jahren sein!";
  }
  return null; // Alles OK
}

/* Berechnungen */
const berechneBMR = (g, gr, a, sex) =>
  sex === "mann"
    ? 10 * g + 6.25 * gr - 5 * a + 5
    : 10 * g + 6.25 * gr - 5 * a - 161;

const berechneSchritteKcal = (s, g, gr) =>
  s * g * 0.0005 * (gr / 170);

const berechneAktivitaetKcal = (met, dauer, freq, g) =>
  ((met * g * (dauer / 60)) * freq) / 7;

/* Diagramm */
function zeichneDiagramm(bmr, schritte, sport, cardio) {
  const ctx = document.getElementById("kcalChart");
  if (kcalChart) kcalChart.destroy();

  const isDark = document.body.classList.contains("dark");

  kcalChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: ["Grundumsatz", "Schritte", "Krafttraining", "Cardio"],
      datasets: [{
        data: [bmr, schritte, sport, cardio],
        backgroundColor: ["#64748b", "#22c55e", "#f97316", "#ef4444"],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            color: isDark ? "#e5e7eb" : "#111827",
            padding: 15,
            font: {
              size: 13
            }
          }
        }
      }
    }
  });
}

/* Hauptfunktion mit Validation und Parsing */
function berechnen() {
  // PARSING - Text in Zahlen umwandeln (nur einmal)
  const g = parseFloat(gewicht.value);
  const gr = parseFloat(groesse.value);
  const a = parseFloat(alter.value);
  
  // VALIDATION - Eingaben überprüfen
  const fehler = validiereEingaben(g, gr, a);
  if (fehler) {
    ergebnis.innerHTML = `<span class="fehler">${fehler}</span>`;
    if (kcalChart) kcalChart.destroy();
    return;
  }

  // Weitere Werte parsen
  const s = parseFloat(schritte.value);
  const sex = geschlecht.value;
  const sportMET = parseFloat(sportIntensitaet.value);
  const sportD = parseFloat(sportDauer.value);
  const sportF = parseFloat(sportFreq.value);
  const cardioMET = parseFloat(cardioIntensitaet.value);
  const cardioD = parseFloat(cardioDauer.value);
  const cardioF = parseFloat(cardioFreq.value);

  // Berechnungen
  const bmr = berechneBMR(g, gr, a, sex);
  const schritteKcal = berechneSchritteKcal(s, g, gr);
  const sportKcal = berechneAktivitaetKcal(sportMET, sportD, sportF, g);
  const cardioKcal = berechneAktivitaetKcal(cardioMET, cardioD, cardioF, g);

  const gesamt = bmr + schritteKcal + sportKcal + cardioKcal;

  // Ergebnis anzeigen
  ergebnis.innerHTML = `<span class="erfolg">Gesamtbedarf: ${Math.round(gesamt)} kcal / Tag</span>`;
  zeichneDiagramm(Math.round(bmr), Math.round(schritteKcal), Math.round(sportKcal), Math.round(cardioKcal));
}

/* Live Update */
document.querySelectorAll("input, select").forEach(el =>
  el.addEventListener("input", berechnen)
);
</script>

</body>
</html>
